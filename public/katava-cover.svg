<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Katava Studio — Source-grounded AI creator agent</title>
  <desc id="description">A product cover showing a product fact sheet flowing through three AI agents, deterministic guardrails, exact-version human approval, and gated exports.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="30" x2="1520" y2="870" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11101D"/>
      <stop offset=".52" stop-color="#18132D"/>
      <stop offset="1" stop-color="#24153D"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(1320 100) rotate(135) scale(760 680)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#795CFF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#795CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(100 860) rotate(-35) scale(670 480)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25D9D0" stop-opacity=".14"/>
      <stop offset="1" stop-color="#25D9D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="95" y1="70" x2="170" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7767FF"/>
      <stop offset="1" stop-color="#A552E4"/>
    </linearGradient>
    <linearGradient id="approved" x1="1130" y1="578" x2="1440" y2="706" gradientUnits="userSpaceOnUse">
      <stop stop-color="#193D36"/>
      <stop offset="1" stop-color="#152E2C"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#FFFFFF" stroke-opacity=".025"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#05030C" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#violetGlow)"/>
  <rect width="1600" height="900" fill="url(#cyanGlow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <g transform="translate(96 76)">
    <rect width="68" height="68" rx="21" fill="url(#brand)"/>
    <path d="M19 17v34M20 35l20-19M20 35l21 17" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m47 11 3 6 6 3-6 3-3 6-3-6-6-3 6-3 3-6Z" fill="#E9E5FF"/>
    <text x="88" y="43" fill="#F7F5FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="31" font-weight="700" letter-spacing="-.8">Katava Studio</text>
  </g>
  <g transform="translate(1274 94)">
    <rect width="230" height="40" rx="20" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".1"/>
    <circle cx="23" cy="20" r="5" fill="#5EEAD4"/>
    <text x="39" y="26" fill="#C9C4DA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="1.2">CREATOR AGENT</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="96" y="249" fill="#FFFFFF" font-size="69" font-weight="750" letter-spacing="-2.8">From product facts to</text>
    <text x="96" y="329" fill="#FFFFFF" font-size="69" font-weight="750" letter-spacing="-2.8">approval-ready content.</text>
    <text x="100" y="381" fill="#AAA4BD" font-size="25" font-weight="400">Source-Grounded AI Creator Agent with Deterministic Guardrails</text>
    <text x="100" y="425" fill="#7F788F" font-size="21">Create for Instagram, TikTok/Reels, and Marketplace—without losing the evidence.</text>

    <g transform="translate(100 476)" font-size="16" font-weight="650">
      <rect width="178" height="42" rx="21" fill="#8B75FF" fill-opacity=".12" stroke="#9B88FF" stroke-opacity=".3"/>
      <text x="22" y="27" fill="#C7BCFF">3 specialized agents</text>
      <g transform="translate(194)">
        <rect width="210" height="42" rx="21" fill="#5EEAD4" fill-opacity=".08" stroke="#5EEAD4" stroke-opacity=".22"/>
        <text x="22" y="27" fill="#9AF2E5">Deterministic review</text>
      </g>
      <g transform="translate(420)">
        <rect width="178" height="42" rx="21" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".1"/>
        <text x="22" y="27" fill="#D2CDDC">Human sign-off</text>
      </g>
    </g>
  </g>

  <g transform="translate(958 202)" filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect width="546" height="486" rx="30" fill="#F8F7FC"/>
    <rect x="1" y="1" width="544" height="484" rx="29" fill="none" stroke="#FFFFFF" stroke-opacity=".7"/>
    <rect width="546" height="66" rx="30" fill="#FFFFFF"/>
    <path d="M0 38a28 28 0 0 0 28 28h490a28 28 0 0 0 28-28" fill="#FFFFFF"/>
    <circle cx="31" cy="33" r="5" fill="#FE2C55"/>
    <circle cx="49" cy="33" r="5" fill="#F7B84B"/>
    <circle cx="67" cy="33" r="5" fill="#42C793"/>
    <text x="98" y="39" fill="#777185" font-size="15" font-weight="600">Campaign review</text>
    <rect x="427" y="20" width="92" height="27" rx="13.5" fill="#EEEBFF"/>
    <text x="447" y="38" fill="#6D5DFB" font-size="12" font-weight="700">GROUNDED</text>

    <g transform="translate(28 92)">
      <rect width="146" height="170" rx="18" fill="#FFFFFF" stroke="#E8E4EF"/>
      <rect x="18" y="18" width="34" height="34" rx="10" fill="#EFEAFF"/>
      <path d="M28 27h14M28 33h14M28 39h9" stroke="#7767FF" stroke-width="2" stroke-linecap="round"/>
      <text x="18" y="76" fill="#292532" font-size="16" font-weight="700">Source truth</text>
      <text x="18" y="99" fill="#8B8594" font-size="12">Facts + excerpts</text>
      <rect x="18" y="118" width="109" height="8" rx="4" fill="#EEEAF4"/>
      <rect x="18" y="135" width="82" height="8" rx="4" fill="#EEEAF4"/>
      <rect x="18" y="152" width="97" height="8" rx="4" fill="#EEEAF4"/>
    </g>

    <path d="M183 177h30" stroke="#B9B1C8" stroke-width="2" stroke-dasharray="4 5"/>
    <path d="m208 172 6 5-6 5" fill="none" stroke="#8B819D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(222 92)">
      <rect width="296" height="170" rx="18" fill="#FFFFFF" stroke="#E8E4EF"/>
      <text x="18" y="31" fill="#8B8594" font-size="11" font-weight="750" letter-spacing="1.4">BOUNDED AGENT WORKFLOW</text>
      <g transform="translate(18 50)">
        <rect width="79" height="82" rx="14" fill="#F2EFFF"/>
        <circle cx="39.5" cy="27" r="13" fill="#7767FF"/>
        <path d="M34 27h11M39.5 21.5v11" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        <text x="19" y="58" fill="#423A55" font-size="13" font-weight="700">Planner</text>
      </g>
      <g transform="translate(108 50)">
        <rect width="79" height="82" rx="14" fill="#F0FAF8"/>
        <circle cx="39.5" cy="27" r="13" fill="#22A68E"/>
        <path d="m34 32 5-11 7 2-5 11-8 3 1-5Z" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
        <text x="22" y="58" fill="#31564F" font-size="13" font-weight="700">Writer</text>
      </g>
      <g transform="translate(198 50)">
        <rect width="79" height="82" rx="14" fill="#FFF4F1"/>
        <circle cx="39.5" cy="27" r="13" fill="#EF7A59"/>
        <path d="m33 27 4 4 9-9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="16" y="58" fill="#67473E" font-size="13" font-weight="700">Reviewer</text>
      </g>
    </g>

    <g transform="translate(28 286)">
      <rect width="490" height="76" rx="16" fill="#211B35"/>
      <rect x="16" y="17" width="42" height="42" rx="12" fill="#FFFFFF" fill-opacity=".08"/>
      <path d="M37 25 27 29v7c0 7 4 12 10 14 6-2 10-7 10-14v-7l-10-4Z" fill="none" stroke="#A99AFF" stroke-width="2"/>
      <path d="m32 37 4 4 7-8" fill="none" stroke="#A99AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="74" y="31" fill="#FFFFFF" font-size="15" font-weight="700">Deterministic Rule Engine</text>
      <text x="74" y="53" fill="#A9A1B8" font-size="12">Claims · citations · policy · hard blocks</text>
      <rect x="397" y="24" width="75" height="28" rx="14" fill="#5EEAD4" fill-opacity=".12"/>
      <text x="415" y="43" fill="#8EEBDC" font-size="11" font-weight="700">ENFORCED</text>
    </g>

    <g transform="translate(28 382)">
      <rect width="490" height="76" rx="16" fill="url(#approved)" stroke="#2E6658" stroke-opacity=".45"/>
      <circle cx="39" cy="38" r="20" fill="#46C89F"/>
      <path d="m30 38 6 6 12-13" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="74" y="32" fill="#FFFFFF" font-size="15" font-weight="700">Exact-version human approval</text>
      <text x="74" y="54" fill="#9CC8BA" font-size="12">Integrity rechecked before every export</text>
      <path d="M429 27v23m-8-8 8 8 8-8M416 51h26" fill="none" stroke="#A5E4D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(96 770)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <path d="M0 0H1408" stroke="#FFFFFF" stroke-opacity=".09"/>
    <g transform="translate(0 38)">
      <text y="18" fill="#FFFFFF" font-size="23" font-weight="700">3 formats</text>
      <text y="43" fill="#827B91" font-size="15">one shared source of truth</text>
    </g>
    <g transform="translate(350 38)">
      <text y="18" fill="#FFFFFF" font-size="23" font-weight="700">≤ 3 review cycles</text>
      <text y="43" fill="#827B91" font-size="15">bounded remediation, fail-closed exits</text>
    </g>
    <g transform="translate(763 38)">
      <text y="18" fill="#FFFFFF" font-size="23" font-weight="700">Tamper-evident</text>
      <text y="43" fill="#827B91" font-size="15">append-only decisions and export evidence</text>
    </g>
    <g transform="translate(1190 38)">
      <text y="18" fill="#FFFFFF" font-size="23" font-weight="700">MD · JSON · TXT</text>
      <text y="43" fill="#827B91" font-size="15">approval-gated release artifacts</text>
    </g>
  </g>
</svg>
